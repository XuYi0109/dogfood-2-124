<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 电商平台商品展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            color: white;
            min-width: 280px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .ui-panel h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ui-panel .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .product-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .product-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .product-btn.active {
            background: linear-gradient(135deg, #e94560, #c73e54);
            border-color: #e94560;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .product-btn .icon {
            font-size: 24px;
        }

        .product-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .product-info .price {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 8px;
        }

        .product-info .description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-hint span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-picker {
            margin-top: 16px;
            display: flex;
            gap: 10px;
        }

        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: white;
            box-shadow: 0 0 0 2px #e94560;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div class="ui-panel">
            <h1>3D 商品展示</h1>
            <p class="subtitle">360° 全景查看体验</p>
            
            <div class="product-selector">
                <button class="product-btn active" data-product="phone">
                    <span class="icon">📱</span>
                    <span>智能手机</span>
                </button>
                <button class="product-btn" data-product="cup">
                    <span class="icon">☕</span>
                    <span>保温杯</span>
                </button>
                <button class="product-btn" data-product="chair">
                    <span class="icon">🪑</span>
                    <span>设计师椅子</span>
                </button>
            </div>

            <div class="product-info" id="product-info">
                <h3 id="product-name">旗舰智能手机</h3>
                <div class="price" id="product-price">¥5,999</div>
                <p class="description" id="product-desc">
                    搭载最新处理器，超清显示屏，专业级摄像系统。支持5G网络，续航持久，设计精美。
                </p>
                <div class="color-picker" id="color-picker">
                    <div class="color-option active" style="background: #1a1a1a;" data-color="0x1a1a1a"></div>
                    <div class="color-option" style="background: #c0c0c0;" data-color="0xc0c0c0"></div>
                    <div class="color-option" style="background: #e94560;" data-color="0xe94560"></div>
                    <div class="color-option" style="background: #4169e1;" data-color="0x4169e1"></div>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            <span>🖱️ 拖拽旋转</span>
            <span>🔍 滚轮缩放</span>
            <span>✋ 右键平移</span>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>加载 3D 场景中...</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
